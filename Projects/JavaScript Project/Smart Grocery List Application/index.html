<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Grocery List App</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>
<body>
    <div class="container mt-5">
        <div class="card shadow p-4 mx-auto" style="max-width: 500px;">
            <h3 class="text-center mb-3">
                Grocery List Application
            </h3>

            <form id="groceryForm" class="d-flex gap-2 mb-3">
                <input type="text" id="name" class="form-control" placeholder="Item name" required>
                <input type="number" id="qty" class="form-control" placeholder="Qty" required>
                
                <button class="btn btn-sucess">
                    <i class="fa fa-plus"></i>
                </button>
            </form>

            <h5 class="text-center">
                Total Items : <span id="total" class="badge bg-primary">0</span>
            </h5>
            <ul id="list" class="list-group mt-3"></ul>
        </div>
    </div>

    <script>
        let groceries = JSON.parse(localStorage.getItem("groceries")) || [];
        const form = document.getElementById("groceryForm");
        const list = document.getElementById("list");
        const total = document.getElementById("total");
    </script>

</body>
</html>
