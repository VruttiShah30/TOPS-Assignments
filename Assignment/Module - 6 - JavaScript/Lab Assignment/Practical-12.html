<!DOCTYPE html>
<html>
<head>
    <title>Try-Catch Example</title>
</head>
<body>

<h1>Check Console for Output</h1>

<script>
    try {
        let a = 10;
        let b = 0;

        // Attempt division
        if (b === 0) {
            throw new Error("Cannot divide by zero!");
        }

        let result = a / b;
        console.log("Result:", result);

    } catch (error) {
        console.log("Error:", error.message);
    } finally {
        console.log("Execution completed.");
    }
</script>

</body>
</html>
