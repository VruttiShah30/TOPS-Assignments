<!DOCTYPE html>
<html>
<head>
    <title>JavaScript Data Types Example</title>
</head>
<body>

<h1>Check Console for Output</h1>

<script>
    // Declaring variables of different data types
    let str = "Hello, JavaScript";
    let num = 25;
    let isActive = true;
    let emptyValue = null;
    let notDefined;

    // Logging values and their types
    console.log("Value:", str, "| Type:", typeof str);
    console.log("Value:", num, "| Type:", typeof num);
    console.log("Value:", isActive, "| Type:", typeof isActive);
    console.log("Value:", emptyValue, "| Type:", typeof emptyValue);
    console.log("Value:", notDefined, "| Type:", typeof notDefined);
</script>

</body>
</html>
