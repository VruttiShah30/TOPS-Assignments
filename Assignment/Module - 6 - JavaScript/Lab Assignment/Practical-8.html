<!DOCTYPE html>
<html>
<head>
    <title>JavaScript Object Example</title>
</head>
<body>

<h1>Check Console for Output</h1>

<script>
    // Create car object
    let car = {
        brand: "Toyota",
        model: "Camry",
        year: 2020
    };

    // Access and print brand and model
    console.log("Brand:", car.brand);
    console.log("Model:", car.model);

    // Update year property
    car.year = 2023;

    // Add new property 'color'
    car.color = "Black";

    // Print updated object
    console.log("Updated Car Object:", car);

</script>

</body>
</html>
