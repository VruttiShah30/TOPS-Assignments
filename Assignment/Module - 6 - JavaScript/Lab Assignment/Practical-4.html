<!DOCTYPE html>
<html>
<head>
    <title>JavaScript If-Else and Switch Example</title>
</head>
<body>

<h1>Check Console for Output</h1>

<script>
    // -------- Task 1: Check Positive, Negative, or Zero --------

    let num = prompt("Enter a number:");

    num = Number(num); // Convert input to number

    if (num > 0) {
        console.log("The number is Positive");
    } else if (num < 0) {
        console.log("The number is Negative");
    } else {
        console.log("The number is Zero");
    }


    // -------- Task 2: Display Day of the Week --------
    
    let day = prompt("Enter a number (1-7) for day of the week:");

    day = Number(day); // Convert input to number

    switch (day) {
        case 1:
            console.log("Monday");
            break;
        case 2:
            console.log("Tuesday");
            break;
        case 3:
            console.log("Wednesday");
            break;
        case 4:
            console.log("Thursday");
            break;
        case 5:
            console.log("Friday");
            break;
        case 6:
            console.log("Saturday");
            break;
        case 7:
            console.log("Sunday");
            break;
        default:
            console.log("Invalid input! Please enter a number between 1 and 7.");
    }

</script>

</body>
</html>
