<!DOCTYPE html>
<html>
<head>
    <title>Button Click Event</title>
</head>
<body>

<h1>Click the Button</h1>

<button id="myButton">Click Me</button>

<script>
    // Select the button
    let button = document.getElementById("myButton");

    // Add event listener
    button.addEventListener("click", function() {
        alert("Button clicked!");
    });
</script>

</body>
</html>
