<!DOCTYPE html>
<html>
<head>
    <title>JavaScript Loops Example</title>
</head>
<body>

<h1>Check Console for Output</h1>

<script>
    // -------- Task 1: For Loop (1 to 10) --------
    console.log("Numbers from 1 to 10:");
    for (let i = 1; i <= 10; i++) {
        console.log(i);
    }


    // -------- Task 2: While Loop (Sum of even numbers 1 to 20) --------
    let i = 1;
    let sum = 0;

    while (i <= 20) {
        if (i % 2 === 0) {
            sum += i;
        }
        i++;
    }

    console.log("Sum of even numbers from 1 to 20:", sum);


    // -------- Task 3: Do-While Loop (Input until > 10) --------
    let num;

    do {
        num = prompt("Enter a number greater than 10:");
        num = Number(num);
    } while (num <= 10);

    console.log("You entered a number greater than 10:", num);

</script>

</body>
</html>
