<!DOCTYPE html>
<html>
<head>
    <title>DOM Manipulation Example</title>
</head>
<body>

<p id="myPara">Hello, World!</p>

<script>
    // Select the paragraph
    let para = document.getElementById("myPara");

    // Change text
    para.textContent = "JavaScript is fun!";

    // Change color
    para.style.color = "blue";
</script>

</body>
</html>
