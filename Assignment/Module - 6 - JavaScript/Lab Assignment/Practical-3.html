<!DOCTYPE html>
<html>
<head>
    <title>JavaScript Operators Example</title>
</head>
<body>

<h1>Check Console for Output</h1>

<script>
    // Declare two numbers
    let a = 15;
    let b = 5;

    // Arithmetic Operations
    console.log("Addition:", a + b);
    console.log("Subtraction:", a - b);
    console.log("Multiplication:", a * b);
    console.log("Division:", a / b);

    // Comparison Operations
    console.log("Are a and b equal?", a == b);
    console.log("Is a greater than b?", a > b);

    // Logical Operations
    let condition1 = (a > 10);
    let condition2 = (b < 5);

    console.log("Condition1 (a > 10):", condition1);
    console.log("Condition2 (b < 5):", condition2);
    console.log("Both conditions true?", condition1 && condition2);

</script>

</body>
</html>
