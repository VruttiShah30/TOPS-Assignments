<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Greetings</title>
</head>
<body>
    <button>Show Greeting</button>
</body>

<script>
    let btn = document.querySelector("button");

    btn.addEventListener("click",function() {
        alert("Hello from JS !");
    })
    
</script>
</html>
