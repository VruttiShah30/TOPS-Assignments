<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>
<body>

    <div class="container mt-5">
       <div class="" id="loader">
            
       </div>
       <div class="" id="error" >
            
       </div>
        <div class="row" id="pro">

            <div class="col">
                Column
            </div>
            <div class="col">
                Column
            </div>
        </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>

    <script>
        function printProduct(productArray) {
            let str ="";
            console.log(productArray);

            productArray.map((index,i) => {
                str += `
                
                <div class="col">
                    <div class = "card" style="width :18rem">
                        
                        <img src = ${index.thumbnail} class = "card-img-top" alt="...">

                        <div class = "card-body">

                            <h5 class = "card-title">${index.title}</h5>
                            
                            <p class = "card-text">${index.description}</p>

                            <p class = "card-text">${index.description}</p>

                            <a href = "#" class = "btn btn-primary">Add to Cart</a>
                        </div>
                    </div>
                </div>  
                                
                `     
            })
            document.getElementById('pro').innerHTML = str;
        }

        const myProductPromise = new Promise(( resolve,reject) =>{
            fetch('https://dummyjson.com/products')
            .then(res => res.json())
            .then(console.log);
        })

        document.getElementById('loader').innerHTML = '<h1>Loading......</h1>'

        myProductPromise.then((data) => {
            setTimeout(() => {
                document.getElementById('loader').innerHTML = '';
                printProduct(data)
            },2000)
            .catch((err) => console.log(err))
            .finally(() => console.log("Promise is either resolved or rejected"))
        })

    </script>
</body>
</html>
