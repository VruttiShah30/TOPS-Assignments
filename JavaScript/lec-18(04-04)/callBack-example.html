<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>

<body>
    <div class="container mt-5">
        <div class="row" id="pro">

            <div class="col">
                Column
            </div>
            <div class="col">
                Column
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>
    <script>

        function printProduct(productArray) {
            let str = "";
            console.log(productArray);
            
            productArray.map((index, i) => {
                str += `
                    <div class="col">
                        <div class="card" style="width: 18rem;">
                    <img src=${index.thumbnail} class="card-img-top" alt="...">
                    <div class="card-body">
                        <h5 class="card-title">${index.title}</h5>
                        <p class="card-text">${index.description}</p>
                         <p class="card-text">Rs.${index.price}</p>
                        <a href="#" class="btn btn-primary">Add to Card</a>
                    </div>
                    </div>
        </div>

                `
            })
            document.getElementById('pro').innerHTML=str
        }

        function getProduct(printProduct) {
            let res = fetch('https://api.freeapi.app/api/v1/public/randomproducts?page=1&limit=10&inc=category%252Cprice%252Cthumbnail%252Cimages%252Ctitle%252Cid&query=mens-watches')
                .then((res) => res.json())
                .then((result) => printProduct(result.data.data))


                .catch((err) => console.log(err)
                )

        }
        getProduct(printProduct);
    </script>



</body>

</html>
