<!-- Create and remove elements -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create and remove elements</title>
    <style>
        .container{
            padding: 100px;
            border: 10px solid black;
            margin-top: 100px;
        }
    </style>
</head>
<body>
    <div class="container" id="main">
    <button onclick="createPara()">Create Paragraph</button>
    </div>

    <!-- <div class="container" id="main1"></div> -->
     <div class="container" id="main1">
        <p id="sec">Lorem ipsum dolor sit amet consectetur adipisicing elit. Modi, consectetur.</p>
        <button onclick="removePara()">Remove Paragraph</button>
     </div>


    <script>
        //Create Paragraph
        function createPara() {
            let p1=document.createElement('p');
            p1.innerText="Welcome to Tops Technology";
            console.log(p1);
            document.getElementById('main').appendChild(p1);
            
        }

        //Remove Paragraph

        function removePara() {
            // Remove Only Paragraph
            let p1=document.getElementById('sec');
            document.getElementById('main1').removeChild(p1);


            //Remove Div

            // document.getElementById('main1').remove('main1');
        }
    </script>
</body>
</html>
