<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advance-funtion Example</title>
    <script>
//function as Expression 
        let num1 = function(num){
            return num*num;
        }

        console.log(num1(5));

//Arrow Function
        let mul = (a,b)=>a*b;

        console.log(mul(2,3));

//get data from API
        const ans= (x,y)=>{
            let z=x+y;
            console.log(z);
            
        }
        ans(2,5);




    </script>
</head>
