<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        class Maths{
            static pi = 3.14;
            #privateData = "privatedata"

            constructor(x){
                this.x = x ;

            }

            areaOfCircle(){
                let area = Maths.pi*this.x*this.x;
                console.log(area);
                Maths.printHello()
                console.log(this.#privateData);
            }

            static printHello(){
                console.log("Welcome to Tops Technology");
            }
        }

        let m1 = new Maths(2);
        console.log(m1.x);
        m1.areaOfCircle();


        let m2 = new Maths(1000);
        console.log(m2.x);
        m2.areaOfCircle();


    </script>
</body>
</html>
