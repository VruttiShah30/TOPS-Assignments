<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            height: 600px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .clock{
            padding: 50px 100px;
            background-color: darkblue;
            color: whitesmoke;
            font-size: 2em;
        }
    </style>
</head>
<body>
    <div class="clock" id="clock"></div>
    <script>
        console.log("first");
//==========================settimeout==================

        setTimeout(()=>{
            console.log("second");
        },2000);

        console.log("third");

//=====================setinterval===============================
        setInterval(() => {
            console.log("set inereval called");
        }, 3000);

//==============================digital clock================================

    function digitalClock(){
        let nowTime = new Date();
        let year = nowTime.getFullYear();
        let month = String(nowTime.getMonth() + 1).padStart(2, '0');
        let day = String(nowTime.getDate()).padStart(2, '0');

        let hours = String(nowTime.getHours()).padStart(2, '0');
        let minutes = String(nowTime.getMinutes()).padStart(2, '0');
        let seconds = String(nowTime.getSeconds()).padStart(2, '0');

        let formattedDate = `${year}-${month}-${day} ${hours}:${minutes}:${seconds}`;

        document.getElementById('clock').innerText=formattedDate;
}
    setInterval(digitalClock,1000);
    </script>
</body>
</html>
