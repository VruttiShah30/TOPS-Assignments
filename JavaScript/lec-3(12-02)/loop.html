<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loop</title>
    <script>
        let i=1;
        let sum=0;
        while(i<=10){
            console.log("i=",i);
            i++;
            sum=sum=i;
            
        }
        console.log("sum=",sum);
        
    </script>
</head>

</body>
