<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conditional</title>
    <script>
        function numberChecker(){
            let num=prompt("Enter Number");
            //(condition)?true:false;
            let msg=(num>0)? " Number is Positive":"Number is Negative";
            alert(msg)
        }
    </script>
</head>
<body>
    <button onclick="numberChecker()">Number Find</button>
</body>
</html>
