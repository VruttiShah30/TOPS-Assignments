<!-- Get Elements by its ID , CLASS NAME -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dom - 1</title>
    <style>
        .main{
            display: flex;
            gap: 20px;
        }
        .box{
            height: 100px;
            width: 100px;
            background-color: aquamarine;
            text-align: center;
            padding: 50px;
            font-size: 2em;
            margin: 20px 0px;
        }
    </style>
</head>
<body>
    <p id="para-1">WelCome to Tops Technology</p>
    <p id="para-2">WelCome to Tops Technology</p>
    <p id="para-3">WelCome to Tops Technology</p>
    <p id="para-4">WelCome to Tops Technology</p>
    <p id="para-5">WelCome to Tops Technology</p>

    <div class="main">
        <div class="box" id="box-1">box-1</div>
        <div class="box" id="box-2">box-2</div>
        <div class="box" id="box-3">box-3</div>
        <div class="box" id="box-4">box-4</div>
        <div class="box" id="box-5">box-5</div>
    </div>

    <button onclick="applyBorder()">Apply Border</button>
    
    <script>
        let p1=document.getElementById('para-1');

        console.log(p1);
        
        function applyBorder() {
            let divarray = document.getElementsByClassName('box');
            console.log(divarray);

            for(i=0;i<divarray.length;i++){
                console.log(divarray[i]);
                divarray[i].style.border="10px solid brown";
            }
            
            
            
        }
    </script>
</body>
</html>
