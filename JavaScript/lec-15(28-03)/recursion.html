<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rescurtion</title>
</head>
<body>
    <script>
        //5! = 5*4! 5*4*3! 5*4*3*2! 5*4*3*2*1
        
        function factFind(num){
            if(num==1){
                return 1;
            }
            f= num*factFind(num-1);
            return f;
        }
        console.log(factFind(5));// 120


        //Rest Parameter Example 

        function add(...args){
            let sum = 0;
            for(i=0;i<args.length;i++){
                sum = sum +args[i];
            }
            return sum;
        }
        console.log(add(1,2)); // 3
        console.log(add(1,2,3,4,5)); //15


        //Spread Example

        let arr = [3,5,1];
        //Spreads turns array into a list of arguments
        console.log(Math.max(...arr));// 5

        let str = "Vrutti";
        console.log(Array.from(str)); // (6) ['V', 'r', 'u', 't', 't', 'i']

        

    </script>
</body>
</html>
